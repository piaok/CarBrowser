<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车机浏览器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1565c0 100%);
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 40px;
    -webkit-user-select: none;
    user-select: none;
}

/* Scrollable content wrapper */
.page-wrapper {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
}

/* Top bar: clock + settings */
.top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

/* Clock */
.clock-container {
    text-align: center;
}
.clock-time {
    font-size: 64px;
    font-weight: 300;
    letter-spacing: 4px;
    animation: fadeIn 1s ease;
}
.clock-date {
    font-size: 16px;
    opacity: 0.7;
    margin-top: 2px;
}

/* Settings button */
.settings-btn {
    width: 44px;
    height: 44px;
    border-radius: 22px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #ffffff;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
.settings-btn:hover { background: rgba(255,255,255,0.25); }
.settings-btn:active { background: rgba(255,255,255,0.3); }

/* Search Bar */
.search-container {
    width: 100%;
    margin-bottom: 30px;
}
.search-bar {
    width: 100%;
    height: 48px;
    border-radius: 24px;
    border: none;
    padding: 0 24px;
    font-size: 18px;
    background: rgba(255,255,255,0.15);
    color: #ffffff;
    outline: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
.search-bar::placeholder { color: rgba(255,255,255,0.5); }
.search-bar:focus {
    background: rgba(255,255,255,0.25);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.3);
}

/* Quick Links Grid */
.links-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    width: 100%;
}
.link-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 8px;
    border-radius: 16px;
    background: rgba(255,255,255,0.1);
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    -webkit-tap-highlight-color: transparent;
}
.link-item:hover { background: rgba(255,255,255,0.2); }
.link-item:active { transform: scale(0.95); }
.link-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-bottom: 8px;
}
.link-title {
    font-size: 13px;
    opacity: 0.9;
}

/* Settings Panel (hidden by default) */
.settings-panel {
    display: none;
    width: 100%;
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    margin-top: 24px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
.settings-panel.visible { display: block; }
.settings-title {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 16px;
    opacity: 0.9;
}
.setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
.setting-row:last-child { border-bottom: none; }
.setting-label {
    font-size: 15px;
    opacity: 0.9;
}
.setting-value {
    font-size: 15px;
    opacity: 0.7;
}

/* Toggle switch */
.toggle {
    width: 44px;
    height: 24px;
    border-radius: 12px;
    background: rgba(255,255,255,0.3);
    position: relative;
    cursor: pointer;
    transition: background 0.3s;
    -webkit-tap-highlight-color: transparent;
}
.toggle.active { background: #4CAF50; }
.toggle-knob {
    width: 20px;
    height: 20px;
    border-radius: 10px;
    background: #ffffff;
    position: absolute;
    top: 2px;
    left: 2px;
    transition: left 0.3s;
}
.toggle.active .toggle-knob { left: 22px; }

/* Select dropdown for search engine */
.engine-select {
    background: rgba(255,255,255,0.15);
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    padding: 4px 12px;
    font-size: 14px;
    outline: none;
    -webkit-appearance: none;
}
.engine-select option { background: #283593; color: #ffffff; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="page-wrapper">

<!-- Top Bar -->
<div class="top-bar">
    <div class="clock-container">
        <div class="clock-time" id="clock">00:00</div>
        <div class="clock-date" id="date"></div>
    </div>
    <button class="settings-btn" id="settingsBtn">⚙️</button>
</div>

<!-- Search Bar -->
<div class="search-container">
    <input type="text" class="search-bar" id="search" placeholder="输入网址或搜索..." autocomplete="off">
</div>

<!-- Quick Links -->
<div class="links-grid" id="links"></div>

<!-- Settings Panel -->
<div class="settings-panel" id="settingsPanel">
    <div class="settings-title">⚙️ 设置</div>

    <div class="setting-row">
        <span class="setting-label">广告拦截</span>
        <div class="toggle" id="adblockToggle">
            <div class="toggle-knob"></div>
        </div>
    </div>

    <div class="setting-row">
        <span class="setting-label">搜索引擎</span>
        <select class="engine-select" id="engineSelect">
            <option value="baidu">百度</option>
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="sogou">搜狗</option>
        </select>
    </div>

    <div class="setting-row">
        <span class="setting-label">版本</span>
        <span class="setting-value">1.0.0</span>
    </div>
</div>

</div><!-- end page-wrapper -->

<script>
// Clock update
function updateClock() {
    var now = new Date();
    var h = now.getHours().toString().padStart(2, '0');
    var m = now.getMinutes().toString().padStart(2, '0');
    document.getElementById('clock').textContent = h + ':' + m;

    var days = ['日','一','二','三','四','五','六'];
    var dateStr = (now.getMonth()+1) + '月' + now.getDate() + '日 周' + days[now.getDay()];
    document.getElementById('date').textContent = dateStr;
}
updateClock();
setInterval(updateClock, 10000);

// Search bar
document.getElementById('search').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && this.value.trim()) {
        if (window.CarBridge) {
            window.CarBridge.openUrl(this.value.trim());
        }
        this.value = '';
    }
});

// Quick links
var defaultLinks = [
    {title:'百度', url:'https://www.baidu.com', icon:'🔍'},
    {title:'B站', url:'https://www.bilibili.com', icon:'📺'},
    {title:'知乎', url:'https://www.zhihu.com', icon:'💬'},
    {title:'淘宝', url:'https://www.taobao.com', icon:'🛒'},
    {title:'微博', url:'https://www.weibo.com', icon:'📢'},
    {title:'京东', url:'https://www.jd.com', icon:'📦'},
    {title:'优酷', url:'https://www.youku.com', icon:'🎬'},
    {title:'酷狗', url:'https://www.kugou.com', icon:'🎵'}
];

function loadLinks() {
    var container = document.getElementById('links');
    container.innerHTML = '';
    var links = defaultLinks;

    // Try to load from CarBridge
    if (window.CarBridge) {
        try {
            var json = window.CarBridge.getQuickLinks();
            if (json) {
                var parsed = JSON.parse(json);
                if (parsed && parsed.length > 0) links = parsed;
            }
        } catch(e) {}
    }

    links.forEach(function(link) {
        var div = document.createElement('div');
        div.className = 'link-item';
        div.innerHTML = '<div class="link-icon">' + (link.icon || '🌐') +
            '</div><div class="link-title">' + link.title + '</div>';
        div.addEventListener('click', function() {
            if (window.CarBridge) {
                window.CarBridge.openUrl(link.url);
            }
        });
        container.appendChild(div);
    });
}

loadLinks();

// Settings toggle
document.getElementById('settingsBtn').addEventListener('click', function() {
    var panel = document.getElementById('settingsPanel');
    panel.classList.toggle('visible');
});

// AdBlock toggle
var adblockToggle = document.getElementById('adblockToggle');
if (window.CarBridge) {
    try {
        var enabled = window.CarBridge.isAdBlockEnabled();
        if (enabled) adblockToggle.classList.add('active');
    } catch(e) {}
}
adblockToggle.addEventListener('click', function() {
    this.classList.toggle('active');
    // TODO: call CarBridge to persist setting
});

// Search engine select
var engineSelect = document.getElementById('engineSelect');
if (window.CarBridge) {
    try {
        var engine = window.CarBridge.getSearchEngine();
        if (engine) engineSelect.value = engine;
    } catch(e) {}
}
engineSelect.addEventListener('change', function() {
    // TODO: call CarBridge to persist engine choice
});
</script>
</body>
</html>
